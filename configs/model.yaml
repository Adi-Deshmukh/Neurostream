# NeuroStream Model Config
#
# SNN architecture with Spatial SNN layer and 512-dim prototype memory.

snn:
  in_features: 66
  hidden: 256
  out_features: 512
  beta: 0.9
  threshold: 0.5
  enable_spatial: true
  spatial_filters_per_band: 8

prototype_memory:
  alpha: 0.30
  momentum: 0.70
  temperature: 0.1
  confidence_threshold: 0.75

sleep_consolidation:
  enabled: true
  interval: 50
  steps: 5
  noise_std: 0.05
  pull_rate: 0.5
