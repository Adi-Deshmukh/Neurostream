[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurostream"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24", 
    "scipy>=1.10", 
    "mne>=1.5",
    "moabb>=1.1", 
    "torch>=2.0", 
    "snntorch>=0.7",
    "PyYAML>=6.0"
    ]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "scikit-learn>=1.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
